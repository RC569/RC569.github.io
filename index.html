<!DOCTYPE html>
<html lang="en">
	<head>
		<title>round cat monster</title>
        <link rel="icon" type="image/gif" href="/resources/favicon.gif" sizes="20x20">
        <meta charset="utf-8">
		<style>
			body {
				background-color: #111;
				color: #eee;
				font-family: Arial, Helvetica, sans-serif;
				font-size: 2em
			}
			.monster {
				display: grid;
				justify-content: center
			}
            #tunes {
                position: absolute;
                bottom: 0
            }
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
	<body>
		<div class="monster">
			<i>crunch</i>
			<img src="/resources/nom.jpg"/>
		</div>
		<audio controls loop id="tunes" style="position:absolute;bottom:0"><source src="/resources/CANTAFFORD.opus"></audio>
        <script>
            var audio = document.getElementById("tunes")
            audio.volume = 0.5;
            audio.addEventListener("canplaythrough", () => {
               audio.play().catch(e => {
                  window.addEventListener('click', () => {audio.play()}, { once: true })
               })
            });
        </script>
	</body>
</html>
