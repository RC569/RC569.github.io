<!DOCTYPE html>
<html lang="en">
<head>
    <title>round cat monster</title>
    <meta charset="utf-8">
    <meta content="round cat monster" property="og:title" />
    <meta content="nom" property="og:description" />
    <meta content="https://www.roundcat.monster/" property="og:url" />
    <meta content="https://www.roundcat.monster/resources/nom.jpg" property="og:image" />
    <link rel="icon" type="image/gif" href="/resources/favicon.gif" sizes="20x20">
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2em;
            margin: 10vh auto
        }

        .monster img {
            display: grid;
            margin: 0 auto
        }

        .crunch {
            animation-name: crunchcolor;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            margin: 0 auto
        }

        @keyframes crunchcolor {
            0% {filter: hue-rotate(0deg)}
            50% {filter: hue-rotate(20deg)}
            100% {filter: hue-rotate(0deg)}
        }

        #tunes {
            position: absolute;
            bottom: 0
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!--
        I have to keep them happy or they will be upset with me :(
        The monster requested a home so this is what I created for them
    -->
    <div class="monster">
        <img src="/resources/nom.jpg" />
        <img class="crunch" src="/resources/crunch.png" />
    </div>

    <audio controls loop id="tunes" style="position:absolute;bottom:0">
        <source src="/resources/tunes/AloneInTheTown.opus">
    </audio>

    <script>
        var audio = document.getElementById("tunes")
        audio.volume = 0.5;
        audio.addEventListener("canplaythrough", () => {
            audio.play().catch(e => {
                window.addEventListener('click', () => {audio.play()}, {once: true})
            })
        });
    </script>
</body>
</html>
